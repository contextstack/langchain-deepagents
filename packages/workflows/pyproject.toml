[project]
name = "cs-workflows"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "cs-core",
    "cs-gateway",
    "cs-knowledge",
    "cs-mcp-servers",
    "cs-telemetry",
    "langchain[mcp]>=1.0.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "deepagents>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workflows"]
